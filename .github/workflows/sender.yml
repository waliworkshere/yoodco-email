# Keeps live campaigns sending on hosts without a background worker (e.g. Vercel Hobby).
# One job stays on for ~5h45m and calls /api/cron/tick about every minute; the schedule
# starts the next job so there is always one running. Each call sends what is due, reads
# replies, sends booking links and records meetings.
#
# No secrets needed: the app checks a GitHub-signed token proving the call comes from this
# workflow in this repository. Set the repository variable APP_URL to use another address.
name: Sender

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sender.yml"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep the sender running
        env:
          APP_URL: ${{ vars.APP_URL || 'https://yoodco-email.vercel.app' }}
        run: |
          # Never let one bad response stop the loop: a hiccup only skips that minute.
          set +e
          end=$((SECONDS + 345 * 60))
          while [ $SECONDS -lt $end ]; do
            token=$(curl -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=yood-outreach" 2>/dev/null | jq -r '.value // empty' 2>/dev/null)
            if [ -z "$token" ]; then
              echo "$(date -u +%H:%M:%S) could not get a GitHub token, retrying"
              sleep 20; continue
            fi
            out=$(curl -sS --max-time 75 -H "Authorization: Bearer $token" "$APP_URL/api/cron/tick" 2>&1)
            line=$(echo "$out" | jq -c '{ok, sent, failed, ticks, error}' 2>/dev/null)
            echo "$(date -u +%H:%M:%S) ${line:-$(echo "$out" | head -c 200)}"
            sleep 20
          done
          exit 0
