# Keeps live campaigns sending on hosts without a background worker (e.g. Vercel Hobby).
# Every 5 minutes it calls /api/cron/tick, which sends for ~50 seconds, reads replies,
# sends booking links and records meetings.
#
# Setup: repository Settings → Secrets and variables → Actions → add
#   APP_URL      https://yoodco-email.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in Vercel → Settings → Environment Variables
#
# GitHub runs scheduled jobs "at best every 5 minutes" and sometimes later. For full speed
# (20 an hour), also add a free every-minute job at cron-job.org calling the same address.
name: Sender

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the sender for a minute
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set in the repository secrets; nothing to do."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick" | head -c 2000
